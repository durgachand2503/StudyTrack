<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StudyTrack — Plan, track, and master your studies with smart timers, analytics, and collaborative learning.">
  <title>StudyTrack — Smart Study Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <script>
    // Prevent FOUC: apply theme before anything renders
    (function(){
      const t = localStorage.getItem('st_theme') || 'system';
      const eff = t === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : t;
      document.documentElement.setAttribute('data-theme', eff);
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="auth-page" id="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">S</div>
          <h1 class="auth-title" id="auth-title">Welcome Back</h1>
          <p class="auth-subtitle" id="auth-subtitle">Sign in to continue your learning journey</p>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="login-form" aria-label="Login form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input class="form-input" type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-input" type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password" minlength="8">
          </div>
          <button class="btn btn-primary btn-lg w-full" type="submit" id="login-btn">Sign In</button>
        </form>

        <!-- Register Form -->
        <form class="auth-form hidden" id="register-form" aria-label="Registration form">
          <div class="form-group">
            <label class="form-label" for="register-name">Full Name</label>
            <input class="form-input" type="text" id="register-name" placeholder="John Doe" required autocomplete="name" minlength="2" maxlength="50">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-email">Email</label>
            <input class="form-input" type="email" id="register-email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="register-password">Password</label>
              <input class="form-input" type="password" id="register-password" placeholder="Min. 8 characters" required autocomplete="new-password" minlength="8">
            </div>
            <div class="form-group">
              <label class="form-label" for="register-confirm">Confirm Password</label>
              <input class="form-input" type="password" id="register-confirm" placeholder="Confirm password" required autocomplete="new-password">
            </div>
          </div>
          <button class="btn btn-primary btn-lg w-full" type="submit" id="register-btn">Create Account</button>
        </form>

        <div class="auth-toggle" id="auth-toggle">
          Don't have an account? <a id="toggle-auth" tabindex="0" role="button">Sign Up</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { api, setTokens, setStoredUser, getAccessToken, showToast } from '/js/utils.js';

    // Redirect if already logged in
    if (getAccessToken()) {
      window.location.href = '/dashboard.html';
    }

    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const toggleAuth = document.getElementById('toggle-auth');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const authToggle = document.getElementById('auth-toggle');
    let isLogin = true;
    function toggleMode() {
      isLogin = !isLogin;
      loginForm.classList.toggle('hidden', !isLogin);
      registerForm.classList.toggle('hidden', isLogin);
      authTitle.textContent = isLogin ? 'Welcome Back' : 'Create Account';
      authSubtitle.textContent = isLogin
        ? 'Sign in to continue your learning journey'
        : 'Start your study management journey today';
      authToggle.innerHTML = isLogin
        ? 'Don\'t have an account? <a id="toggle-auth" tabindex="0" role="button">Sign Up</a>'
        : 'Already have an account? <a id="toggle-auth" tabindex="0" role="button">Sign In</a>';
    }

    authToggle.addEventListener('click', (e) => {
      if (e.target && (e.target.id === 'toggle-auth' || e.target.closest('#toggle-auth'))) {
        e.preventDefault();
        toggleMode();
      }
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const result = await api.login({
          email: document.getElementById('login-email').value,
          password: document.getElementById('login-password').value
        });

        if (result.success) {
          setTokens(result.data.accessToken, result.data.refreshToken);
          setStoredUser(result.data.user);
          showToast('Welcome back!', 'success');
          setTimeout(() => window.location.href = '/dashboard.html', 500);
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Register
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;

      if (pw !== confirm) {
        showToast('Passwords do not match', 'error');
        return;
      }

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const result = await api.register({
          name: document.getElementById('register-name').value,
          email: document.getElementById('register-email').value,
          password: pw,
          confirmPassword: confirm
        });

        if (result.success) {
          setTokens(result.data.accessToken, result.data.refreshToken);
          setStoredUser(result.data.user);
          showToast('Account created! Welcome to StudyTrack!', 'success');
          setTimeout(() => window.location.href = '/dashboard.html', 500);
        }
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>

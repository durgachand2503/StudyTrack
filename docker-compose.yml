version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studytrack_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/studytrack
      - JWT_SECRET=production_jwt_secret_change_me_before_deploying
      - REFRESH_TOKEN_SECRET=production_refresh_secret_change_me_before_deploying
      - FRONTEND_URL=http://localhost:5000
      - SOCKET_CORS_ORIGIN=http://localhost:5000
    depends_on:
      - mongo
    volumes:
      - app_uploads:/app/backend/uploads

  mongo:
    image: mongo:7-jammy
    container_name: studytrack_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  app_uploads:
